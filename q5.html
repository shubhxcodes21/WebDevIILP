<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Login Page</title>
</head>

<body>
    <h2>Login Form</h2>
    <form>
         <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Shubh Agrawal" required>
        </div>
        <br> 
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="abcxd12@32" required>
        </div>
        <br>
        <div>
             <button type="submit">Submit</button>
             <button type="reset">Reset</button>
        </div>
    </form>

</body>
</html>
