<!DOCTYPE html>
<html>
<head>
<title>HTML Lists</title>
</head>
<body>
    <h1>THE THREE LIST TYPES ARE:</h1>

<h2>Ordered List</h2>
<ol>
    <li>Wake up</li>
    <li>Brush teeth</li>
    <li>Eat breakfast</li>
</ol>

<h2>Unordered List</h2>
<ul>
    <li>Apple</li>
    <li>Banana</li>
    <li>Orange</li>
</ul>

<h2>Description List</h2>
<dl>
    <dt>HTML</dt>
    <dd>Markup language for web pages</dd>

    <dt>CSS</dt>
    <dd>Language for styling web pages</dd>
</dl>

</body>
</html>
